name: UlulaWake
options:
  bundleIdPrefix: com.yingkaisun
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  UlulaWake:
    type: application
    platform: macOS
    sources:
      - path: UlulaWake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yingkaisun.UlulaWake
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: UlulaWake/UlulaWake.entitlements
    info:
      path: UlulaWake/Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        CFBundleDisplayName: UlulaWake
        CFBundleShortVersionString: "2026.9.1"
        CFBundleVersion: "5"
  UlulaWakeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UlulaWakeTests
    dependencies:
      - target: UlulaWake
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UlulaWake:
    build:
      targets:
        UlulaWake: all
    test:
      targets:
        - UlulaWakeTests
      environmentVariables:
        ULULAWAKE_UNIT_TESTS: "1"
